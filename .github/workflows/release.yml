name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Tag must match Info.plist version
        run: |
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$plist" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != plist v$plist"; exit 1; }
      - run: make test
      - run: make dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/DnDCategoriser.zip \
            --title "DnDCategoriser $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
